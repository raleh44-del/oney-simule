<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulateur Oney</title>
<!--
  Passerelle d'adresse.

  GitHub Pages peut etre configure pour servir soit la racine du depot,
  soit le dossier /docs. Selon le cas, l'application repond a une adresse
  differente. Ce fichier fait que /oney/ fonctionne dans les deux cas :

  - Pages sert la racine : ce fichier est servi et renvoie vers ../docs/oney/
  - Pages sert /docs     : ce fichier n'est jamais servi, et /oney/ tombe
                           directement sur l'application (docs/oney/index.html)

  L'adresse de renvoi est relative : elle survit a un renommage du depot.
-->
<meta http-equiv="refresh" content="0; url=../docs/oney/">
<link rel="canonical" href="../docs/oney/">
<script>location.replace('../docs/oney/' + location.search + location.hash);</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
    background:#0b0d12;color:#f1f4fa;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
  a{color:#ffc400;font-weight:800}
</style>
</head>
<body>
  <div>
    <p>Ouverture du simulateur…</p>
    <p><a href="../docs/oney/">Continuer</a></p>
  </div>
</body>
</html>

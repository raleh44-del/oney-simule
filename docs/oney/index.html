<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulateur Oney — ES & EC</title>
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Simu Oney">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ===================== THÈME ===================== */
:root{
  --bg:#0b0d12; --bg-haut:#141924;
  --surf:#141821; --surf2:#1b202b; --surf3:#232936;
  --line:#262d3b; --line2:#333c4d;
  --txt:#f1f4fa; --muted:#98a3b6; --faint:#6b7688;
  --jaune:#ffc400; --rouge:#e8232a;
  --ombre:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="clair"]{
  --bg:#eef1f6; --bg-haut:#ffffff;
  --surf:#ffffff; --surf2:#f4f6fa; --surf3:#e9edf4;
  --line:#dde3ec; --line2:#c9d2e0;
  --txt:#10141c; --muted:#5d6878; --faint:#8b95a5;
  --ombre:0 1px 2px rgba(16,20,28,.06), 0 10px 24px -16px rgba(16,20,28,.35);
}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px; line-height:1.4;
  max-width:560px; margin:0 auto;
  padding-bottom:calc(84px + var(--safe-b));
  transition:background .2s,color .2s;
}
b,strong{font-weight:800}

/* ===================== EN-TÊTE ===================== */
header{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb,var(--bg-haut) 88%,transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  display:flex; align-items:center; gap:11px;
}
.logo{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--jaune),#ff9d00);
  color:#0b0d12;display:grid;place-items:center;
  font-size:20px;font-weight:900;
  box-shadow:0 4px 14px -4px rgba(255,196,0,.6);
}
header h1{font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.1;white-space:nowrap}
header .sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;
  display:flex;align-items:center;gap:5px}
header .sub i{width:5px;height:5px;border-radius:50%;background:var(--jaune);display:inline-block}
.icone{
  margin-left:auto;width:38px;height:38px;flex:0 0 auto;
  background:var(--surf2);border:1px solid var(--line);border-radius:11px;
  color:var(--txt);font-size:17px;cursor:pointer;display:grid;place-items:center;
}
.icone:active{background:var(--surf3)}

main{padding:14px 12px 0;display:flex;flex-direction:column;gap:12px}

/* ===================== SÉLECTEUR DE MODE ===================== */
.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:5px;
  background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:5px;
}
.seg button{
  position:relative;background:transparent;border:0;border-radius:12px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:800;color:var(--muted);
  padding:10px 4px;line-height:1.2;transition:.15s;
}
.seg button span{display:block;font-size:9.5px;font-weight:700;margin-top:2px;opacity:.7}
.seg button.on{
  background:linear-gradient(145deg,var(--jaune),#ffb300);color:#0b0d12;
  box-shadow:0 4px 14px -6px rgba(255,196,0,.75);
}

/* ===================== SAISIE ===================== */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;
  padding:14px;box-shadow:var(--ombre)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tete-champ{height:26px;display:flex;align-items:center;margin-bottom:7px}
.champ label{
  display:flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);
}
.champ label i{width:6px;height:6px;border-radius:2px;display:inline-block}
.mini{display:flex;gap:3px;background:var(--surf2);border:1px solid var(--line);
  border-radius:10px;padding:2px}
.mini button{
  border:0;background:transparent;border-radius:8px;cursor:pointer;font-family:inherit;
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
  color:var(--muted);padding:4px 9px;transition:.15s;
}
.mini button.on{background:var(--jaune);color:#0b0d12}
.boite{
  position:relative;background:var(--surf2);border:1.5px solid var(--line);
  border-radius:14px;transition:.15s;
}
.boite:focus-within{border-color:var(--jaune);box-shadow:0 0 0 3px rgba(255,196,0,.14)}
.boite input{
  width:100%;background:transparent;border:0;outline:none;color:var(--txt);
  font-family:inherit;font-size:27px;font-weight:800;letter-spacing:-.6px;
  font-variant-numeric:tabular-nums;padding:12px 32px 12px 13px;
}
.boite.unite-mois input{padding-right:52px}
.boite input::placeholder{color:var(--faint)}
.boite .eur{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:18px;font-weight:800;color:var(--faint);pointer-events:none}
.boite.unite-mois .eur{font-size:13px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rapide{display:flex;gap:6px;margin-top:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rapide::-webkit-scrollbar{display:none}
.rapide button{
  flex:0 0 auto;background:var(--surf2);border:1px solid var(--line);border-radius:999px;
  color:var(--muted);font-family:inherit;font-size:12px;font-weight:800;
  padding:7px 12px;cursor:pointer;
}
.rapide button.on{background:rgba(255,196,0,.14);border-color:var(--jaune);color:var(--jaune)}

/* ===================== OPTION EC ===================== */
.ec-tete{display:flex;align-items:center;gap:11px}
.ec-tete .t{font-size:13.5px;font-weight:800}
.ec-tete .s{font-size:11px;color:var(--muted);margin-top:1px}
.switch{margin-left:auto;position:relative;width:50px;height:29px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:relative;z-index:2;cursor:pointer}
.slider{position:absolute;inset:0;background:var(--surf3);border:1px solid var(--line);
  border-radius:999px;transition:.18s}
.slider::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;
  border-radius:50%;background:var(--faint);transition:.18s}
.switch input:checked + .slider{background:rgba(255,196,0,.22);border-color:var(--jaune)}
.switch input:checked + .slider::after{transform:translateX(21px);background:var(--jaune)}
.ec-corps{margin-top:13px;display:none}
.ec-corps.on{display:block}
.tarifs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.tarif{
  background:var(--surf2);border:1.5px solid var(--line);border-radius:13px;
  padding:9px 3px;text-align:center;cursor:pointer;transition:.15s;
}
.tarif b{display:block;font-size:16px;font-weight:900}
.tarif span{display:block;font-size:9px;color:var(--muted);margin-top:2px;line-height:1.2}
.tarif.on{border-color:var(--jaune);background:rgba(255,196,0,.13)}
.tarif.on b{color:var(--jaune)}

/* ===================== INFO ===================== */
.info{
  background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--jaune);
  border-radius:14px;padding:11px 13px;font-size:12.5px;color:var(--muted);line-height:1.45;
}
.info b{color:var(--txt)}

/* ===================== CARTES RÉSULTAT ===================== */
#resultats{display:flex;flex-direction:column;gap:11px}
.opt{
  --opt:#9aa7b8;
  position:relative;background:var(--surf);border:1px solid var(--line);
  border-radius:18px;padding:13px 14px 12px;box-shadow:var(--ombre);overflow:hidden;
}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--opt)}
.opt.top{border-color:color-mix(in srgb,var(--opt) 55%,var(--line))}
.opt.top::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 0% 0%,color-mix(in srgb,var(--opt) 13%,transparent),transparent 70%)}
.opt.ko{opacity:.5}
.opt > *{position:relative;z-index:1}

.tete{display:flex;align-items:flex-start;gap:9px;margin-bottom:11px}
.nom{font-size:14.5px;font-weight:900;letter-spacing:-.1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pastille{width:9px;height:9px;border-radius:50%;background:var(--opt);flex:0 0 auto;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--opt) 22%,transparent)}
.sous{font-size:11px;color:var(--muted);margin-top:3px}
.reco{background:var(--opt);color:#0b0d12;font-size:9px;font-weight:900;letter-spacing:.5px;
  border-radius:999px;padding:2px 7px}
.prime{
  margin-left:auto;flex:0 0 auto;text-align:right;
  background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:5px 9px;
  font-size:13.5px;font-weight:900;color:var(--opt);white-space:nowrap;
}
.prime small{font-size:9px;font-weight:700;color:var(--muted);display:block;margin-top:1px}

.grand{display:flex;align-items:baseline;gap:7px;font-variant-numeric:tabular-nums}
.grand b{font-size:30px;font-weight:900;letter-spacing:-1.2px;line-height:1}
.grand span{font-size:16px;font-weight:800;color:var(--muted)}
.puis{font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.puis b{color:var(--txt)}

.jauge{display:flex;align-items:center;gap:9px;margin:11px 0 12px}
.piste{flex:1;height:6px;border-radius:999px;background:var(--surf3);overflow:hidden}
.piste i{display:block;height:100%;border-radius:999px;background:var(--opt)}
.jauge em{font-style:normal;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  border-top:1px solid var(--line);padding-top:10px}
.kpi span{display:block;font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:.4px;color:var(--muted);white-space:nowrap}
.kpi b{display:block;font-size:14.5px;font-weight:900;margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.bas{margin-top:9px;font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px}
.bas em{font-style:normal;background:var(--surf2);border:1px solid var(--line);
  border-radius:8px;padding:3px 7px}
.bas em b{color:var(--txt)}
.alerte-ko{font-size:13px;font-weight:700;color:#ff9ea1}

/* ===================== BARRE DU BAS ===================== */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--bg-haut) 88%,transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:10px 12px calc(10px + var(--safe-b));
  display:flex;gap:9px;max-width:560px;margin:0 auto;
}
.dock button{
  flex:1;border-radius:13px;padding:13px;font-family:inherit;font-size:13.5px;
  font-weight:800;cursor:pointer;border:1px solid var(--line);
  background:var(--surf2);color:var(--txt);
}
.dock button:active{transform:scale(.985)}
.dock .primaire{
  flex:1.6;border:0;background:linear-gradient(145deg,var(--jaune),#ffb300);color:#0b0d12;
  box-shadow:0 6px 18px -8px rgba(255,196,0,.9);
}
footer{padding:16px 18px 4px;font-size:10.5px;color:var(--faint);line-height:1.55;text-align:center}
</style>
</head>
<body>

<header>
  <div class="logo">€</div>
  <div>
    <h1>Simulateur Oney</h1>
    <div class="sub"><i></i>Crédit rond · TAEG 20,50 %</div>
  </div>
  <button class="icone" id="theme" type="button" aria-label="Changer de thème">☀</button>
</header>

<main>

  <!-- MODE -->
  <div class="seg" id="modes">
    <button class="on" data-mode="es" type="button">Garanties ES<span>base · XL · 2XL · 3XL</span></button>
    <button data-mode="ec" type="button">Assurance EC<span>2 · 4 · 7 · 10 €</span></button>
  </div>

  <!-- SAISIE -->
  <section class="panel">
    <div class="duo">
      <div class="champ">
        <div class="tete-champ">
          <label><i style="background:#63b3ed"></i>Montant à financer</label>
        </div>
        <div class="boite">
          <input id="montant" type="number" inputmode="decimal" step="1" min="0" placeholder="0">
          <span class="eur">€</span>
        </div>
      </div>
      <div class="champ">
        <div class="tete-champ">
          <div class="mini" id="calcul">
            <button class="on" data-calcul="budget" type="button">Budget</button>
            <button data-calcul="duree" type="button">Durée</button>
          </div>
        </div>
        <div class="boite" id="boite2">
          <input id="budget" type="number" inputmode="decimal" step="1" min="0" placeholder="0">
          <span class="eur" id="unite">€</span>
        </div>
      </div>
    </div>
    <div class="rapide" id="rapide"></div>
  </section>

  <!-- OPTION ASSURANCE MOBILE (mode ES) -->
  <section class="panel" id="carteEC">
    <div class="ec-tete">
      <div>
        <div class="t">Assurance mobile <span style="color:var(--jaune)">EC</span></div>
        <div class="s">Casse, oxydation, vol</div>
      </div>
      <label class="switch">
        <input id="ecOn" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>
    <div class="ec-corps" id="ecCorps">
      <div class="champ">
        <div class="tete-champ"><label>Prix du mobile (TTC)</label></div>
        <div class="boite">
          <input id="prixMobile" type="number" inputmode="decimal" step="1" min="0" placeholder="0">
          <span class="eur">€</span>
        </div>
      </div>
      <div class="tarifs" id="tarifs">
        <div class="tarif" data-p="2"><b>2 €</b><span>jusqu'à<br>149,99 €</span></div>
        <div class="tarif" data-p="4"><b>4 €</b><span>150 à<br>299,99 €</span></div>
        <div class="tarif" data-p="7"><b>7 €</b><span>300 à<br>499,99 €</span></div>
        <div class="tarif" data-p="10"><b>10 €</b><span>500 €<br>et +</span></div>
      </div>
    </div>
  </section>

  <div id="alerte"></div>
  <div id="resultats"></div>

  <footer>
    Simulation indicative — crédit rond, TAEG fixe 20,50 %.<br>
    Ne remplace pas l'édition officielle Oney.
  </footer>
</main>

<div class="dock">
  <button type="button" id="btnReset">Effacer</button>
  <button type="button" id="btnCopie" class="primaire">Copier la simulation</button>
</div>

<script>
/* ===================== MOTEUR DE CALCUL ===================== */
const TAEG = 0.2050;                                  // CRÉDIT ROND
const TAUX_MENSUEL = Math.pow(1 + TAEG, 1/12) - 1;    // ≈ 1,5661 % / mois

/* Garanties ES : prime mensuelle prélevée sur le budget */
const ES = [
  {type:'ES', nom:'GARANTIE DE BASE', sous:'garantie légale',   prime:0,  col:'#9aa7b8'},
  {type:'ES', nom:'ELECTROSÛR XL',    sous:'1 univers produit', prime:6,  col:'#ffc400'},
  {type:'ES', nom:'ELECTROSÛR 2XL',   sous:'2 univers',         prime:11, col:'#63b3ed'},
  {type:'ES', nom:'ELECTROSÛR 3XL',   sous:'3 univers',         prime:15, col:'#37c98a'}
];

/* Assurance mobile EC : prime mensuelle prélevée sur le budget */
const EC = [
  {type:'EC', nom:'SANS ASSURANCE', sous:'mobile non couvert',      prime:0,  col:'#9aa7b8'},
  {type:'EC', nom:'EC 2 €',  sous:"mobile jusqu'à 149,99 €", prime:2,  col:'#ffc400'},
  {type:'EC', nom:'EC 4 €',  sous:'mobile de 150 à 299,99 €',prime:4,  col:'#63b3ed'},
  {type:'EC', nom:'EC 7 €',  sous:'mobile de 300 à 499,99 €',prime:7,  col:'#37c98a'},
  {type:'EC', nom:'EC 10 €', sous:'mobile à partir de 500 €', prime:10, col:'#ff8a5c'}
];

/* Barème assurance mobile EC selon le prix TTC du mobile */
function primeEC(prix){
  if (!(prix > 0)) return 0;
  if (prix < 150) return 2;
  if (prix < 300) return 4;
  if (prix < 500) return 7;
  return 10;
}

/*
  BUDGET IMPOSÉ — amortissement Oney.
  La mensualité qui rembourse réellement le crédit est le budget DIMINUÉ
  des primes mensuelles (ES + EC).
  Chaque mois : solde = solde * (1 + taux) - mensualité crédit.
*/
function simuler(capital, mensualiteCredit){
  if (!(capital > 0)) return {ok:false, motif:'vide'};
  if (mensualiteCredit <= 0) return {ok:false, motif:'budget'};
  if (mensualiteCredit <= capital * TAUX_MENSUEL) return {ok:false, motif:'interets'};
  let solde = capital, mois = 0, interets = 0;
  while (mois < 600){
    const int_m = solde * TAUX_MENSUEL;
    if (solde + int_m <= mensualiteCredit + 1e-9){
      return {ok:true, mois, derniere: solde + int_m, interets: interets + int_m};
    }
    solde += int_m - mensualiteCredit;
    interets += int_m;
    mois++;
  }
  return {ok:false, motif:'trop_long'};
}

/*
  DURÉE IMPOSÉE — annuité constante.
  Mensualité de crédit qui solde exactement le capital en N mois :
      m = C × i / (1 - (1 + i)^-N)
  Les primes ES / EC viennent s'ajouter par-dessus : à durée fixée elles
  n'engendrent aucun intérêt supplémentaire, elles gonflent la mensualité.
*/
function mensualitePourDuree(capital, mois){
  const i = TAUX_MENSUEL;
  return capital * i / (1 - Math.pow(1 + i, -mois));
}

/* Résultat unifié, quel que soit le sens du calcul */
function resultat(capital, valeur, prime, ec, sens){
  if (sens === 'duree'){
    const N = Math.round(valeur);
    if (!(capital > 0)) return {ok:false, motif:'vide'};
    if (!(N > 0))       return {ok:false, motif:'duree'};
    if (N > 600)        return {ok:false, motif:'trop_long'};
    const mc = mensualitePourDuree(capital, N);
    const interets = mc * N - capital;
    return {ok:true, sens:'duree', echeances:N, moisPrime:N,
            mensCredit:mc, mensualite: mc + prime + ec, interets,
            total:(mc + prime + ec) * N, coutMois: interets / N};
  }
  const mc = valeur - prime - ec;
  const r = simuler(capital, mc);
  if (!r.ok) return r;
  return {ok:true, sens:'budget', echeances: r.mois + (r.derniere >= 0.01 ? 1 : 0),
          moisPrime:r.mois, mois:r.mois, derniere:r.derniere,
          mensCredit:mc, mensualite:valeur, interets:r.interets,
          total: r.mois * valeur + r.derniere,
          coutMois: r.interets / (r.mois + r.derniere / mc)};
}

/* ===================== OUTILS ===================== */
const $ = s => document.querySelector(s);
const eMontant = $('#montant'), eBudget = $('#budget'), ePrix = $('#prixMobile'),
      eEcOn = $('#ecOn'), eEcCorps = $('#ecCorps'), eTarifs = $('#tarifs'),
      eRes = $('#resultats'), eAlerte = $('#alerte'), eModes = $('#modes'),
      eCarteEC = $('#carteEC'), eRapide = $('#rapide'), eTheme = $('#theme'),
      eCalcul = $('#calcul'), eUnite = $('#unite'), eBoite2 = $('#boite2');

let ecManuel = null;      // prime EC forcée par une pastille (sinon déduite du prix)
let mode = 'es';          // 'es' = garanties ElectroSûr | 'ec' = assurance mobile
let calcul = 'budget';    // 'budget' = durée calculée | 'duree' = mensualité calculée
let vBudget = '', vDuree = '';   // les deux saisies du 2e champ, mémorisées séparément

const BUDGETS = [20, 30, 40, 50, 60, 80, 100, 150];
const DUREES  = [6, 10, 12, 15, 18, 20, 24, 30, 36, 48];

const num  = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const eur  = v => v.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
const eur0 = v => (Math.round(v*100)/100).toLocaleString('fr-FR',
  {minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits:2}) + ' €';

function primeECActive(){
  if (!eEcOn.checked) return 0;
  return ecManuel !== null ? ecManuel : primeEC(num(ePrix.value));
}

/* Unité, placeholder et pastilles rapides du 2e champ */
function majChamp2(){
  const duree = calcul === 'duree';
  eUnite.textContent = duree ? 'mois' : '€';
  eBoite2.classList.toggle('unite-mois', duree);
  eBudget.placeholder = duree ? '12' : '0';
  eCalcul.querySelectorAll('button').forEach(b =>
    b.classList.toggle('on', b.dataset.calcul === calcul));
  eRapide.innerHTML = (duree ? DUREES : BUDGETS)
    .map(v => '<button type="button" data-v="' + v + '">' + v + (duree ? ' mois' : ' €') + '</button>')
    .join('');
}

/* ===================== AFFICHAGE ===================== */
function calculer(){
  const capital = num(eMontant.value);
  const valeur  = num(eBudget.value);
  // en mode EC, les cartes SONT les tarifs d'assurance : pas de prime additionnelle
  const ec = mode === 'es' ? primeECActive() : 0;

  eModes.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  eCarteEC.style.display = mode === 'es' ? '' : 'none';

  const tarifActif = ecManuel !== null ? ecManuel : primeEC(num(ePrix.value));
  eTarifs.querySelectorAll('.tarif').forEach(t =>
    t.classList.toggle('on', eEcOn.checked && +t.dataset.p === tarifActif));
  eRapide.querySelectorAll('button').forEach(b =>
    b.classList.toggle('on', +b.dataset.v === valeur));

  if (calcul === 'budget') vBudget = eBudget.value; else vDuree = eBudget.value;
  sauver();

  if (!(capital > 0) || !(valeur > 0)){
    eAlerte.innerHTML = '';
    eRes.innerHTML = '<div class="panel" style="text-align:center;color:var(--muted);' +
      'font-size:13px;padding:26px 16px">Saisis le <b style="color:#63b3ed">montant à financer</b>' +
      ' et ' + (calcul === 'duree'
        ? 'la <b style="color:var(--jaune)">durée souhaitée</b>.'
        : 'le <b style="color:var(--jaune)">budget mensuel</b>.') + '</div>';
    return;
  }

  const liste = mode === 'ec' ? EC : ES;
  const conseille = mode === 'ec' ? primeEC(capital) : null;

  eAlerte.innerHTML =
    calcul === 'duree'
      ? '<div class="info">Durée imposée : la mensualité est calculée pour solder le crédit ' +
        'en <b>' + Math.round(valeur) + ' mois</b>. À durée égale, une garantie n\'ajoute ' +
        '<b>aucun intérêt</b> — seulement sa prime sur la mensualité.</div>'
      : (mode === 'ec'
        ? '<div class="info">Mobile à ' + eur0(capital) + ' → tarif conseillé ' +
          '<b style="color:var(--jaune)">EC ' + eur0(primeEC(capital)) + '/mois</b>.</div>'
        : (ec > 0
          ? '<div class="info">Assurance mobile <b style="color:var(--jaune)">EC ' + eur0(ec) +
            '/mois</b> incluse dans le budget → il reste <b>' + eur0(valeur - ec) +
            '/mois</b> pour le crédit et la garantie ES.</div>'
          : ''));

  // résultats + échelle commune pour les jauges
  const calculs = liste.map(g => ({g, r: resultat(capital, valeur, g.prime, ec, calcul)}));
  const jaugeVal = r => calcul === 'duree' ? r.mensualite : r.echeances;
  const maxJauge = Math.max(1, ...calculs.filter(c => c.r.ok).map(c => jaugeVal(c.r)));
  const base = calculs[0].r;

  eRes.innerHTML = calculs.map(c =>
    carte(c.g, c.r, valeur, ec, maxJauge, base, c.g.prime === conseille)).join('');
}

function carte(g, r, valeur, ec, maxJauge, base, conseille){
  const tete =
    '<div class="tete">' +
      '<div><div class="nom"><span class="pastille"></span>' + g.nom +
        (conseille ? '<span class="reco">CONSEILLÉ</span>' : '') + '</div>' +
        '<div class="sous">' + g.sous + '</div></div>' +
      '<div class="prime">' + (g.prime ? '+ ' + eur0(g.prime) : '—') +
        '<small>' + (g.prime ? 'par mois' : 'sans option') + '</small></div>' +
    '</div>';

  if (!r.ok){
    const msg = {
      budget:   'Les primes (' + eur0(g.prime + ec) + '/mois) dépassent le budget.',
      interets: 'Budget trop faible : il ne reste que ' + eur0(valeur - g.prime - ec) +
                '/mois pour le crédit, les intérêts ne sont pas couverts.',
      trop_long:'Durée supérieure à 600 mois.',
      duree:    'Durée invalide.',
      vide:     'Montant invalide.'
    }[r.motif];
    return '<article class="opt ko" style="--opt:' + g.col + '">' + tete +
      '<div class="alerte-ko">' + msg + '</div></article>';
  }

  let grand;
  if (r.sens === 'duree'){
    const detail = [];
    if (g.prime) detail.push(g.type + ' ' + eur0(g.prime));
    if (ec)      detail.push('EC ' + eur0(ec));
    grand = '<div class="grand"><b>' + r.echeances + '</b><span>× ' + eur(r.mensualite) + '</span></div>' +
      (detail.length
        ? '<div class="puis">dont crédit <b>' + eur(r.mensCredit) + '</b> + ' + detail.join(' + ') + '</div>'
        : '');
  } else if (r.mois > 0){
    grand = '<div class="grand"><b>' + r.mois + '</b><span>× ' + eur0(valeur) + '</span></div>' +
      (r.derniere >= 0.01 ? '<div class="puis">puis 1 mois à <b>' + eur(r.derniere) + '</b></div>' : '');
  } else {
    grand = '<div class="grand"><b>1</b><span>× ' + eur(r.derniere) + '</span></div>';
  }

  const valJauge = r.sens === 'duree' ? r.mensualite : r.echeances;
  const jauge =
    '<div class="jauge"><span class="piste"><i style="width:' +
      Math.max(6, Math.round(valJauge / maxJauge * 100)) + '%"></i></span>' +
      '<em>' + (r.sens === 'duree' ? eur(r.mensualite) + '/mois' : r.echeances + ' mois') + '</em></div>';

  const puces = [];
  if (g.prime) puces.push('<em>' + g.type + ' ' + eur0(g.prime) + ' × ' + r.moisPrime +
    ' = <b>' + eur0(g.prime * r.moisPrime) + '</b></em>');
  if (ec) puces.push('<em>EC ' + eur0(ec) + ' × ' + r.moisPrime +
    ' = <b>' + eur0(ec * r.moisPrime) + '</b></em>');
  if (base.ok && g.prime){
    puces.push(r.sens === 'duree'
      ? '<em>vs base : <b>+' + eur(r.mensualite - base.mensualite) + '/mois</b> · <b>+' +
        eur(r.total - base.total) + '</b> au total</em>'
      : '<em>vs base : <b>+' + (r.echeances - base.echeances) + ' mois</b> · <b>+' +
        eur(r.interets - base.interets) + '</b></em>');
  }
  if (r.echeances > 48) puces.push('<em style="color:#ff9ea1">⚠ au-delà du barème habituel</em>');

  return '<article class="opt' + (conseille ? ' top' : '') + '" style="--opt:' + g.col + '">' +
    tete + grand + jauge +
    '<div class="kpi">' +
      '<div><span>Coût du crédit</span><b>' + eur(r.interets) + '</b></div>' +
      '<div><span>Soit par mois</span><b>' + eur(r.coutMois) + '</b></div>' +
      '<div><span>Total payé</span><b>' + eur(r.total) + '</b></div>' +
    '</div>' +
    (puces.length ? '<div class="bas">' + puces.join('') + '</div>' : '') +
  '</article>';
}

/* ===================== TEXTE À COPIER ===================== */
function texteSimu(){
  const capital = num(eMontant.value), valeur = num(eBudget.value);
  const ec = mode === 'es' ? primeECActive() : 0;
  if (!(capital > 0 && valeur > 0)) return 'Simulation vide.';
  let t = 'SIMULATION ONEY — TAEG 20,50 % — ' +
          (mode === 'ec' ? 'ASSURANCE MOBILE EC' : 'GARANTIES ES') + '\n' +
          'Montant à financer : ' + eur0(capital) + '\n' +
          (calcul === 'duree' ? 'Durée souhaitée : ' + Math.round(valeur) + ' mois\n'
                              : 'Budget mensuel : ' + eur0(valeur) + '\n') +
          (ec ? 'Assurance mobile EC : ' + eur0(ec) + '/mois\n' : '') + '\n';
  (mode === 'ec' ? EC : ES).forEach(g => {
    const r = resultat(capital, valeur, g.prime, ec, calcul);
    t += (g.prime ? g.nom + ' (+' + eur0(g.prime) + '/mois)' : g.nom) + '\n';
    if (!r.ok){ t += '  Budget insuffisant\n\n'; return; }
    t += r.sens === 'duree'
      ? '  ' + r.echeances + ' mois à ' + eur(r.mensualite) +
        ' (dont crédit ' + eur(r.mensCredit) + ')\n  Coût du crédit : ' + eur(r.interets) + '\n\n'
      : '  ' + (r.mois ? r.mois + ' mois à ' + eur0(valeur) + ' + ' : '') +
        '1 mois à ' + eur(r.derniere) + '\n  Coût du crédit : ' + eur(r.interets) + '\n\n';
  });
  return t;
}

/* ===================== ÉVÉNEMENTS ===================== */
[eMontant, eBudget, ePrix].forEach(el => el.addEventListener('input', () => {
  if (el === ePrix) ecManuel = null;      // retour au barème automatique
  calculer();
}));

eModes.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  mode = b.dataset.mode;
  calculer();
});

eCalcul.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.calcul === calcul) return;
  if (calcul === 'budget') vBudget = eBudget.value; else vDuree = eBudget.value;
  calcul = b.dataset.calcul;
  eBudget.value = calcul === 'budget' ? vBudget : vDuree;
  majChamp2();
  calculer();
});

eRapide.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  eBudget.value = (+b.dataset.v === num(eBudget.value)) ? '' : b.dataset.v;
  calculer();
});

eEcOn.addEventListener('change', () => {
  eEcCorps.classList.toggle('on', eEcOn.checked);
  calculer();
});

eTarifs.addEventListener('click', e => {
  const t = e.target.closest('.tarif');
  if (!t) return;
  const p = +t.dataset.p;
  ecManuel = (ecManuel === p) ? null : p;
  calculer();
});

$('#btnReset').addEventListener('click', () => {
  eMontant.value = ''; eBudget.value = ''; ePrix.value = '';
  vBudget = ''; vDuree = '';
  eEcOn.checked = false; eEcCorps.classList.remove('on'); ecManuel = null;
  calculer(); eMontant.focus();
});

$('#btnCopie').addEventListener('click', async e => {
  const btn = e.currentTarget, txt = texteSimu();
  try { await navigator.clipboard.writeText(txt); }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const old = btn.textContent; btn.textContent = 'Copié ✓';
  setTimeout(() => btn.textContent = old, 1400);
});

/* ===================== THÈME ===================== */
function appliquerTheme(t){
  document.documentElement.dataset.theme = t;
  eTheme.textContent = t === 'clair' ? '☾' : '☀';
  document.querySelector('meta[name=theme-color]')
    .setAttribute('content', t === 'clair' ? '#ffffff' : '#0b0d12');
}
eTheme.addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'clair' ? 'sombre' : 'clair';
  appliquerTheme(t);
  try { localStorage.setItem('simuOneyTheme', t); } catch(_){}
});

/* ===================== MÉMOIRE ===================== */
function sauver(){
  try{
    localStorage.setItem('simuOney', JSON.stringify({
      m:eMontant.value, b:vBudget, d:vDuree, p:ePrix.value,
      e:eEcOn.checked, c:ecManuel, mode:mode, calcul:calcul
    }));
  }catch(_){}
}
function charger(){
  try{
    const d = JSON.parse(localStorage.getItem('simuOney') || '{}');
    if (d.m) eMontant.value = d.m;
    if (d.p) ePrix.value = d.p;
    vBudget = d.b || '';
    vDuree  = d.d || '';
    if (d.e){ eEcOn.checked = true; eEcCorps.classList.add('on'); }
    if (typeof d.c === 'number') ecManuel = d.c;
    if (d.mode === 'ec' || d.mode === 'es') mode = d.mode;
    if (d.calcul === 'duree' || d.calcul === 'budget') calcul = d.calcul;
  }catch(_){}
  eBudget.value = calcul === 'budget' ? vBudget : vDuree;
  majChamp2();
  let t = null;
  try { t = localStorage.getItem('simuOneyTheme'); } catch(_){}
  appliquerTheme(t || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'clair' : 'sombre'));
}
charger();
calculer();

/* ===================== PWA ===================== */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>

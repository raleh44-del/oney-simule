<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulateur Oney — ES & EC</title>
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Simu Oney">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1014; --bg2:#171a21; --bg3:#1f232c;
  --line:#2b303b; --txt:#eef1f6; --muted:#9aa3b2;
  --jaune:#ffc800; --rouge:#e21e26; --vert:#37c98a; --bleu:#63b3ed;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px; line-height:1.4;
  padding:0 0 calc(28px + var(--safe-b));
  max-width:560px; margin:0 auto;
}

/* ---------- HEADER ---------- */
header{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg,#141821 0%,#0e1014 100%);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  display:flex; align-items:center; gap:10px;
}
.logo{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:var(--jaune); color:#0e1014;
  display:grid;place-items:center;font-weight:800;font-size:19px;
}
header h1{font-size:15px;font-weight:800;letter-spacing:.2px;line-height:1.15;white-space:nowrap}
header p{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap}
.taeg{
  margin-left:auto;background:var(--bg3);border:1px solid var(--line);
  border-radius:999px;padding:5px 9px;font-size:10.5px;font-weight:800;color:var(--jaune);
  white-space:nowrap;
}

/* ---------- SELECTEUR DE MODE ---------- */
main{padding:14px 12px 0}
.modes{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:var(--bg2);border:1px solid var(--line);border-radius:15px;
  padding:5px;margin-bottom:12px;
}
.mode{
  background:transparent;border:0;border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:800;color:var(--muted);
  padding:11px 4px;line-height:1.25;transition:.12s;
}
.mode span{display:block;font-size:9.5px;font-weight:700;opacity:.75;margin-top:1px}
.mode.on{background:var(--jaune);color:#101318}
.mode.on span{opacity:.7}

/* ---------- SAISIE ---------- */
.card{
  background:var(--bg2);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:12px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.field{position:relative}
input[type=number]{
  width:100%;background:var(--bg3);border:1.5px solid var(--line);border-radius:12px;
  color:var(--txt);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
  padding:12px 34px 12px 12px;outline:none;
}
input[type=number]:focus{border-color:var(--jaune)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.eur{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:19px;font-weight:800;color:var(--muted);pointer-events:none}
.lbl-montant{color:var(--bleu)}
.lbl-budget{color:var(--jaune)}

/* ---------- EC ---------- */
.ec-head{display:flex;align-items:center;gap:10px}
.ec-head .t{font-size:13.5px;font-weight:800}
.ec-head .s{font-size:11px;color:var(--muted)}
.switch{margin-left:auto;position:relative;width:50px;height:29px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:relative;z-index:2}
.slider{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--line);
  border-radius:999px;transition:.15s}
.slider::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;
  border-radius:50%;background:#7d8797;transition:.15s}
.switch input:checked + .slider{background:rgba(255,200,0,.2);border-color:var(--jaune)}
.switch input:checked + .slider::after{transform:translateX(21px);background:var(--jaune)}
.ec-body{margin-top:12px;display:none}
.ec-body.on{display:block}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.chip{
  background:var(--bg3);border:1.5px solid var(--line);border-radius:11px;
  padding:8px 4px;text-align:center;cursor:pointer;
}
.chip b{display:block;font-size:16px;font-weight:800}
.chip span{display:block;font-size:9.5px;color:var(--muted);margin-top:1px;line-height:1.15}
.chip.on{border-color:var(--jaune);background:rgba(255,200,0,.12)}
.chip.on b{color:var(--jaune)}

/* ---------- RESULTATS ---------- */
.alert{
  background:rgba(226,30,38,.12);border:1px solid rgba(226,30,38,.5);
  color:#ffb3b6;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:12px;
}
.res{border-radius:16px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);background:var(--bg2)}
.res.off{opacity:.45}
.res-top{padding:10px 13px;display:flex;align-items:center;gap:8px;color:#101318}
.res-top .nom{font-size:15px;font-weight:900;letter-spacing:.3px}
.res-top .sous{font-size:10.5px;font-weight:700;opacity:.62;margin-top:1px}
.res-top .prime{margin-left:auto;font-size:12px;font-weight:800;background:rgba(0,0,0,.22);
  border-radius:999px;padding:3px 9px}
.c-base{background:#dfe4ea}
.c-xl{background:var(--jaune)}
.c-2xl{background:#a8d4f5}
.c-3xl{background:#8ee0ac}
.c-ec{background:#f6b48a}
.reco{background:#101318;color:var(--jaune);font-size:9.5px;font-weight:800;
  border-radius:999px;padding:3px 8px;margin-left:6px;white-space:nowrap}
.res-body{padding:12px 13px}
.duree{display:flex;flex-direction:column;gap:3px;margin-bottom:11px}
.duree .l{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.duree .l small{font-size:12px;font-weight:700;color:var(--muted)}
.duree .l2{font-size:14.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  border-top:1px solid var(--line);padding-top:10px}
.stat .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);
  font-weight:700;line-height:1.2;white-space:nowrap}
.stat .v{font-size:14px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.note{margin-top:9px;font-size:11.5px;color:var(--muted)}
.note div{margin-top:2px}
.note b{color:var(--txt)}
.ko{font-size:14px;font-weight:700;color:#ff9ea1}

.actions{display:flex;gap:9px;margin-top:4px}
.btn{
  flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px;font-size:13.5px;font-weight:800;cursor:pointer;
  font-family:inherit;
}
.btn:active{background:var(--bg3)}
.btn.p{background:var(--jaune);border-color:var(--jaune);color:#101318}
footer{padding:16px 16px 0;font-size:10.5px;color:#6c7482;line-height:1.5;text-align:center}
</style>
</head>
<body>

<header>
  <div class="logo">€</div>
  <div>
    <h1>Simulateur Oney</h1>
    <p>Garanties ES · Assurance mobile EC</p>
  </div>
  <div class="taeg">TAEG 20,50 %</div>
</header>

<main>

  <!-- MODE -->
  <div class="modes" id="modes">
    <button class="mode on" data-mode="es" type="button">Garanties ES<span>base · XL · 2XL · 3XL</span></button>
    <button class="mode" data-mode="ec" type="button">Assurance EC<span>mobile : 2 · 4 · 7 · 10 €</span></button>
  </div>

  <!-- SAISIE -->
  <div class="card">
    <div class="grid2">
      <div>
        <label class="lbl-montant">Montant à financer</label>
        <div class="field">
          <input id="montant" type="number" inputmode="decimal" step="1" min="0" placeholder="0">
          <span class="eur">€</span>
        </div>
      </div>
      <div>
        <label class="lbl-budget">Budget mensuel</label>
        <div class="field">
          <input id="budget" type="number" inputmode="decimal" step="1" min="0" placeholder="0">
          <span class="eur">€</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ASSURANCE MOBILE EC (option, en mode ES) -->
  <div class="card" id="carteEC">
    <div class="ec-head">
      <div>
        <div class="t">Assurance mobile <span style="color:var(--jaune)">EC</span></div>
        <div class="s">Casse, oxydation, vol</div>
      </div>
      <label class="switch">
        <input id="ecOn" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>
    <div class="ec-body" id="ecBody">
      <label>Prix du mobile (TTC)</label>
      <div class="field">
        <input id="prixMobile" type="number" inputmode="decimal" step="1" min="0" placeholder="0">
        <span class="eur">€</span>
      </div>
      <div class="chips" id="chips">
        <div class="chip" data-p="2"><b>2 €</b><span>jusqu'à<br>149,99 €</span></div>
        <div class="chip" data-p="4"><b>4 €</b><span>150 à<br>299,99 €</span></div>
        <div class="chip" data-p="7"><b>7 €</b><span>300 à<br>499,99 €</span></div>
        <div class="chip" data-p="10"><b>10 €</b><span>500 €<br>et +</span></div>
      </div>
    </div>
  </div>

  <div id="alerte"></div>
  <div id="resultats"></div>

  <div class="actions">
    <button class="btn" id="btnReset">Effacer</button>
    <button class="btn p" id="btnCopie">Copier la simu</button>
  </div>

  <footer>
    Simulation indicative — CRÉDIT ROND TAEG fixe 20,50 %.<br>
    Ne remplace pas l'édition officielle Oney.
  </footer>
</main>

<script>
/* ===================== MOTEUR DE CALCUL ===================== */
const TAEG = 0.2050;                                  // CRÉDIT ROND
const TAUX_MENSUEL = Math.pow(1 + TAEG, 1/12) - 1;    // ≈ 1,5661 % / mois

/* Garanties ES : prime mensuelle prélevée sur le budget */
const ES = [
  {type:'ES', nom:'GARANTIE DE BASE', sous:'garantie légale',  prime:0,  cls:'c-base'},
  {type:'ES', nom:'ELECTROSÛR XL',    sous:'1 univers produit',prime:6,  cls:'c-xl'},
  {type:'ES', nom:'ELECTROSÛR 2XL',   sous:'2 univers',        prime:11, cls:'c-2xl'},
  {type:'ES', nom:'ELECTROSÛR 3XL',   sous:'3 univers',        prime:15, cls:'c-3xl'}
];

/* Assurance mobile EC : prime mensuelle prélevée sur le budget */
const EC = [
  {type:'EC', nom:'SANS ASSURANCE', sous:'mobile non couvert',      prime:0,  cls:'c-base'},
  {type:'EC', nom:'EC 2 €',  sous:"mobile jusqu'à 149,99 €", prime:2,  cls:'c-xl'},
  {type:'EC', nom:'EC 4 €',  sous:'mobile de 150 à 299,99 €',prime:4,  cls:'c-2xl'},
  {type:'EC', nom:'EC 7 €',  sous:'mobile de 300 à 499,99 €',prime:7,  cls:'c-3xl'},
  {type:'EC', nom:'EC 10 €', sous:'mobile à partir de 500 €', prime:10, cls:'c-ec'}
];

/* Barème assurance mobile EC selon le prix TTC du mobile */
function primeEC(prix){
  if (!(prix > 0)) return 0;
  if (prix < 150) return 2;
  if (prix < 300) return 4;
  if (prix < 500) return 7;
  return 10;
}

/*
  Amortissement Oney : la mensualité qui rembourse réellement le crédit
  est le budget DIMINUÉ des primes mensuelles (ES + EC).
  Chaque mois : solde = solde * (1 + taux) - mensualité crédit.
*/
function simuler(capital, mensualiteCredit){
  if (!(capital > 0)) return {ok:false, motif:'vide'};
  if (mensualiteCredit <= 0) return {ok:false, motif:'budget'};
  if (mensualiteCredit <= capital * TAUX_MENSUEL) return {ok:false, motif:'interets'};
  let solde = capital, mois = 0, interets = 0;
  while (mois < 600){
    const int_m = solde * TAUX_MENSUEL;
    if (solde + int_m <= mensualiteCredit + 1e-9){
      return {ok:true, mois, derniere: solde + int_m, interets: interets + int_m};
    }
    solde += int_m - mensualiteCredit;
    interets += int_m;
    mois++;
  }
  return {ok:false, motif:'trop_long'};
}

/* ===================== AFFICHAGE ===================== */
const $ = s => document.querySelector(s);
const eMontant = $('#montant'), eBudget = $('#budget'), ePrix = $('#prixMobile'),
      eEcOn = $('#ecOn'), eEcBody = $('#ecBody'), eChips = $('#chips'),
      eRes = $('#resultats'), eAlerte = $('#alerte'),
      eModes = $('#modes'), eCarteEC = $('#carteEC');

let ecManuel = null;   // prime EC forcée par un chip (sinon calculée sur le prix)
let mode = 'es';       // 'es' = garanties ElectroSûr | 'ec' = assurance mobile

const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const eur = v => v.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
const eur0 = v => (Math.round(v*100)/100).toLocaleString('fr-FR',
  {minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits:2}) + ' €';

function primeECActive(){
  if (!eEcOn.checked) return 0;
  return ecManuel !== null ? ecManuel : primeEC(num(ePrix.value));
}

function calculer(){
  const capital = num(eMontant.value);
  const budget  = num(eBudget.value);
  // en mode EC, les cartes SONT les tarifs d'assurance : pas de prime additionnelle
  const ec      = mode === 'es' ? primeECActive() : 0;

  // boutons de mode + carte EC optionnelle (mode ES uniquement)
  eModes.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  eCarteEC.style.display = mode === 'es' ? '' : 'none';

  // chips : surligne le tarif actif
  const actif = ecManuel !== null ? ecManuel : primeEC(num(ePrix.value));
  eChips.querySelectorAll('.chip').forEach(c =>
    c.classList.toggle('on', eEcOn.checked && +c.dataset.p === actif));

  sauver();

  if (!(capital > 0) || !(budget > 0)){
    eAlerte.innerHTML = '';
    eRes.innerHTML = '<div class="card" style="text-align:center;color:var(--muted);font-size:13.5px">' +
      'Saisis le <b style="color:var(--bleu)">montant à financer</b> et le ' +
      '<b style="color:var(--jaune)">budget mensuel</b>.</div>';
    return;
  }

  const info = s => '<div class="card" style="padding:10px 13px;font-size:12.5px;' +
    'color:var(--muted);margin-bottom:12px">' + s + '</div>';

  if (mode === 'ec'){
    eAlerte.innerHTML = info('Tarif conseillé d\'après le montant à financer (' + eur0(capital) +
      ') : <b style="color:var(--jaune)">EC ' + eur0(primeEC(capital)) + '/mois</b>.');
    eRes.innerHTML = EC.map(g =>
      carte(g, capital, budget, 0, g.prime === primeEC(capital))).join('');
  } else {
    eAlerte.innerHTML = ec > 0
      ? info('Assurance mobile <b style="color:var(--jaune)">EC ' + eur0(ec) + '/mois</b> incluse dans le budget ' +
             '→ il reste ' + eur0(budget - ec) + '/mois pour le crédit + la garantie ES.')
      : '';
    eRes.innerHTML = ES.map(g => carte(g, capital, budget, ec)).join('');
  }
}

function carte(g, capital, budget, ec, conseille){
  const mensCredit = budget - g.prime - ec;
  const r = simuler(capital, mensCredit);
  const sansPrime = g.type === 'EC' ? '0 €/mois' : 'sans ES';

  const entete =
    '<div class="res-top ' + g.cls + '">' +
      '<div><div class="nom">' + g.nom +
        (conseille ? '<span class="reco">CONSEILLÉ</span>' : '') + '</div>' +
        '<div class="sous">' + g.sous + '</div></div>' +
      '<div class="prime">' + (g.prime ? '+ ' + eur0(g.prime) + '/mois' : sansPrime) + '</div>' +
    '</div>';

  if (!r.ok){
    const msg = {
      budget:   'Budget trop faible : les primes (' + eur0(g.prime + ec) + '/mois) dépassent le budget.',
      interets: 'Budget trop faible : ' + eur0(mensCredit) + '/mois ne couvre même pas les intérêts.',
      trop_long:'Durée supérieure à 600 mois.',
      vide:     'Montant invalide.'
    }[r.motif];
    return '<div class="res off">' + entete +
      '<div class="res-body"><div class="ko">' + msg + '</div></div></div>';
  }

  const totalPaye  = r.mois * budget + r.derniere;
  const dureeReele = r.mois + r.derniere / mensCredit;      // durée en mois "fractionnaire"
  const coutMois   = r.interets / dureeReele;
  const totalES    = g.prime * r.mois;
  const totalEC    = ec * r.mois;

  const ligne1 = r.mois > 0
    ? '<div class="l">' + r.mois + ' <small>mois à</small> ' + eur0(budget) + '</div>'
    : '';
  const ligne2 = r.derniere >= 0.01
    ? '<div class="' + (r.mois > 0 ? 'l2' : 'l') + '">1 <small>mois à</small> ' + eur(r.derniere) + '</div>'
    : '';

  const detail = [];
  if (g.prime) detail.push((g.type === 'EC' ? 'Assurance EC' : 'Garantie ES') +
    ' : <b>' + eur0(g.prime) + ' × ' + r.mois + ' = ' + eur0(totalES) + '</b>');
  if (ec)      detail.push('Assurance EC : <b>' + eur0(ec) + ' × ' + r.mois + ' = ' + eur0(totalEC) + '</b>');
  const alerteDuree = (r.mois + 1) > 48
    ? '<div class="note" style="color:#ffb3b6">⚠ Durée ' + (r.mois + 1) + ' mois — au-delà du barème habituel.</div>'
    : '';

  return '<div class="res">' + entete +
    '<div class="res-body">' +
      '<div class="duree">' + ligne1 + ligne2 + '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="k">Coût du crédit</div><div class="v">' + eur(r.interets) + '</div></div>' +
        '<div class="stat"><div class="k">Soit par mois</div><div class="v">' + eur(coutMois) + '</div></div>' +
        '<div class="stat"><div class="k">Total payé</div><div class="v">' + eur(totalPaye) + '</div></div>' +
      '</div>' +
      (detail.length ? '<div class="note"><div>' + detail.join('</div><div>') + '</div></div>' : '') +
      alerteDuree +
    '</div></div>';
}

/* ===================== TEXTE À COPIER ===================== */
function texteSimu(){
  const capital = num(eMontant.value), budget = num(eBudget.value);
  const ec = mode === 'es' ? primeECActive() : 0;
  if (!(capital > 0 && budget > 0)) return 'Simulation vide.';
  let t = 'SIMULATION ONEY — TAEG 20,50 % — ' +
          (mode === 'ec' ? 'ASSURANCE MOBILE EC' : 'GARANTIES ES') + '\n' +
          'Montant à financer : ' + eur0(capital) + '\n' +
          'Budget mensuel : ' + eur0(budget) + '\n' +
          (ec ? 'Assurance mobile EC : ' + eur0(ec) + '/mois\n' : '') + '\n';
  (mode === 'ec' ? EC : ES).forEach(g => {
    const r = simuler(capital, budget - g.prime - ec);
    t += (g.prime ? g.nom + ' (+' + eur0(g.prime) + '/mois)' : g.nom) + '\n';
    t += r.ok
      ? '  ' + (r.mois ? r.mois + ' mois à ' + eur0(budget) + ' + ' : '') + '1 mois à ' + eur(r.derniere) +
        '\n  Coût du financement : ' + eur(r.interets) + '\n\n'
      : '  Budget insuffisant\n\n';
  });
  return t;
}

/* ===================== ÉVÉNEMENTS ===================== */
[eMontant, eBudget, ePrix].forEach(el => el.addEventListener('input', () => {
  if (el === ePrix) ecManuel = null;      // retour au barème automatique
  calculer();
}));

eEcOn.addEventListener('change', () => {
  eEcBody.classList.toggle('on', eEcOn.checked);
  calculer();
});

eModes.addEventListener('click', e => {
  const b = e.target.closest('.mode');
  if (!b) return;
  mode = b.dataset.mode;
  calculer();
});

eChips.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const p = +chip.dataset.p;
  ecManuel = (ecManuel === p) ? null : p;
  calculer();
});

$('#btnReset').addEventListener('click', () => {
  eMontant.value = ''; eBudget.value = ''; ePrix.value = '';
  eEcOn.checked = false; eEcBody.classList.remove('on'); ecManuel = null;
  calculer(); eMontant.focus();
});

$('#btnCopie').addEventListener('click', async e => {
  const btn = e.currentTarget, txt = texteSimu();
  try { await navigator.clipboard.writeText(txt); }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const old = btn.textContent; btn.textContent = 'Copié ✓';
  setTimeout(() => btn.textContent = old, 1400);
});

/* ===================== MÉMOIRE ===================== */
function sauver(){
  try{
    localStorage.setItem('simuOney', JSON.stringify({
      m:eMontant.value, b:eBudget.value, p:ePrix.value, e:eEcOn.checked, c:ecManuel, mode:mode
    }));
  }catch(_){}
}
function charger(){
  try{
    const d = JSON.parse(localStorage.getItem('simuOney') || '{}');
    if (d.m) eMontant.value = d.m;
    if (d.b) eBudget.value = d.b;
    if (d.p) ePrix.value = d.p;
    if (d.e){ eEcOn.checked = true; eEcBody.classList.add('on'); }
    if (typeof d.c === 'number') ecManuel = d.c;
    if (d.mode === 'ec' || d.mode === 'es') mode = d.mode;
  }catch(_){}
}
charger();
calculer();

/* ===================== PWA ===================== */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>

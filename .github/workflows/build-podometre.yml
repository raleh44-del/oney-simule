name: Build Podometre APK

on:
  push:
    paths:
      - 'podometre/**'
      - '.github/workflows/build-podometre.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: podometre
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp podometre/app/build/outputs/apk/debug/app-debug.apk Podometre.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Podometre-apk
          path: Podometre.apk
          if-no-files-found: error

      - name: Publish APK to a Release (lien de telechargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: podometre
          target_commitish: ${{ github.sha }}
          name: Podometre — dernier APK
          body: |
            Podometre : ajoute des pas dans Health Connect.

            Telecharge **Podometre.apk** ci-dessous et installe-le sur Android
            (autorise l'installation depuis cette source si le telephone le demande).
          files: Podometre.apk
          prerelease: false

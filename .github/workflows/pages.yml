name: Deploy Delrobi (web / iOS PWA)

on:
  push:
    branches:
      - claude/fitness-app-prompt-update-2f22s6
    paths:
      - 'app-muscu.html'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (app + manifest + icônes)
        run: |
          mkdir -p site
          cp app-muscu.html site/index.html
          cp web/manifest.webmanifest site/
          cp web/icon-180.png web/icon-192.png web/icon-512.png site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

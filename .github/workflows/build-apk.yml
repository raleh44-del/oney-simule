name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SimuOney.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimuOney-apk
          path: SimuOney.apk
          if-no-files-found: error

      - name: Publish APK to a Release (lien de telechargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Simu Oney — dernier APK
          body: |
            APK du simulateur Oney (garanties ES et assurance mobile EC),
            regenere automatiquement a chaque modification du simulateur.

            Telecharge **SimuOney.apk** ci-dessous et installe-le sur Android
            (autorise l'installation depuis cette source si le telephone le demande).

            L'application fonctionne entierement hors ligne.
          files: SimuOney.apk
          prerelease: false
